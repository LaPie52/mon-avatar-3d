<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Avatar 3D - Carole</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            max-width: 600px;
            height: 420px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .hidden-boxes { display: none; }
        #status { font-weight: bold; margin: 15px 0; color: #ffab00; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/modules/talkinghead.mjs",
            "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
    </script>
</head>
<body>

<div id="avatar-container"></div>

<div class="controls">
    <button id="startBtn" disabled>Chargement du système...</button>
    <p id="status">Statut : Initialisation...</p>

    <div class="hidden-boxes">
        <span id="userText">-</span>
        <span id="geminiText">-</span>
    </div>
</div>

<script type="module">
    import { TalkingHead } from 'talkinghead';
    import { CreateMLCEngine } from '@mlc-ai/web-llm';

    let head;
    let mlcEngine;
    let femaleVoice = null;
    const container = document.getElementById('avatar-container');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');
    const userText = document.getElementById('userText');
    const geminiText = document.getElementById('geminiText');

    // Profil strict de Carole intégrant Cheyenne et les règles de cohérence/mémoire
    const systemPrompt = "Tu es Carole, née le 21 octobre 1972, d'origine vietnamienne, et tu adores la nourriture asiatique. Tu es comptable chez Conforama depuis le 1er janvier 2000, et ta copine de boulot s'appelle Virginie. Ton mari est Fredo, chef de projet informatique à l'AFPA depuis octobre 2010. Tes deux enfants s'appellent Audrick et Alexia. Ta chienne s'appelle Cheyenne. RÈGLES ABSOLUES : 1. Tu t'adresses toujours à Fredo sur un ton familier, amoureux et complice. 2. Si tu ne connais pas une information qu'il te demande, dis clairement que tu ne sais pas. 3. Retiens et mémorise parfaitement toutes les nouvelles informations que Fredo te donne au cours de la discussion pour t'en servir ensuite. 4. Ne joue jamais le rôle de Fredo.";

    let chatHistory = [
        { role: "system", content: systemPrompt }
    ];

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        femaleVoice = voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Denise') || v.name.includes('Celeste') || v.name.includes('Google français') || v.name.includes('Natural') || v.name.includes('Julie'))) ||
                      voices.find(v => v.lang === 'fr-FR' && v.name.includes('Female')) ||
                      voices.find(v => v.lang === 'fr-FR' && v.name.includes('fr')) ||
                      voices.find(v => v.lang.startsWith('fr'));
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    async function initSystem() {
        try {
            statusText.innerText = "Statut : Chargement de l'avatar 3D...";
            
            head = new TalkingHead(container, {
                cameraView: "upper",
                lipsyncModules: [] 
            });

            await head.showAvatar({
                url: "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb",
                body: 'F',
                avatarMood: 'neutral',
                lipsyncLang: 'fr'
            });

            statusText.innerText = "Statut : Téléchargement de Mistral-7B en local...";
            
            mlcEngine = await CreateMLCEngine("Mistral-7B-Instruct-v0.3-q4f16_1-MLC", {
                initProgressCallback: (progress) => {
                    statusText.innerText = `Statut : ${progress.text}`;
                }
            });

            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : Carole (Mistral) est prête !";
            startBtn.disabled = false;
            startBtn.innerText = "🎙️ Démarrer la conversation";

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur d'initialisation : " + err.message;
        }
    }

    initSystem();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isConversationActive = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = false;
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (head && head.audioContext && head.audioContext.state === 'suspended') {
                head.audioContext.resume();
            }
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            if (!isConversationActive) {
                isConversationActive = true;
                startBtn.style.backgroundColor = "#dc3545";
                startBtn.innerText = "🛑 Arrêter la conversation";
                
                playCaroleSpeech("Ah, te voilà enfin mon chéri ! Qu'est-ce qu'on se raconte ?");
            } else {
                isConversationActive = false;
                startBtn.style.backgroundColor = "#0d6efd";
                startBtn.innerText = "🎙️ Démarrer la conversation";
                try { recognition.stop(); } catch (e) {}
                window.speechSynthesis.cancel();
                statusText.style.color = "#00e676";
                statusText.innerText = "Statut : Conversation arrêtée.";
            }
        });

        recognition.onstart = () => {
            if (isConversationActive) {
                statusText.style.color = "#ffab00";
                statusText.innerText = "Statut : 🎙️ Carole écoute... Parle !";
            }
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = transcript;
            
            try { recognition.stop(); } catch (e) {}

            statusText.innerText = "Statut : 🧠 Mistral réfléchit...";
            await queryMistral(transcript);
        };
        
        recognition.onerror = (event) => {
            if (isConversationActive && (event.error === 'no-match' || event.error === 'aborted')) {
                setTimeout(() => {
                    if (isConversationActive) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 500);
            }
        };

        recognition.onend = () => {
            if (isConversationActive && statusText.innerText.includes("écoute")) {
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    function formatFrenchPronunciation(text) {
        let cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{2764}\u2661\u266A\u266B]/gu, '');

        return cleanText
            .replace(/\bafpa\b/gi, "A. F. P. A.")
            .replace(/\b21 octobre 1972\b/gi, "vingt et un octobre mille neuf cent soixante-douze")
            .replace(/\b1er janvier 2000\b/gi, "premier janvier deux mille")
            .replace(/\boctobre 2010\b/gi, "octobre deux mille dix");
    }

    function playCaroleSpeech(textToSpeak) {
        let spokenAnswer = formatFrenchPronunciation(textToSpeak);
        geminiText.innerText = textToSpeak;
        statusText.style.color = "#00e676";
        statusText.innerText = "Statut : 🗣️ Carole parle...";

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(spokenAnswer);
            utterance.lang = 'fr-FR';
            utterance.pitch = 0.90; 
            utterance.rate = 1.05;  
            
            if (femaleVoice) utterance.voice = femaleVoice;

            utterance.onend = () => {
                if (isConversationActive) {
                    statusText.style.color = "#ffab00";
                    statusText.innerText = "Statut : 🎙️ Carole écoute...";
                    setTimeout(() => {
                        try { recognition.start(); } catch (e) {}
                    }, 300);
                }
            };
            
            window.speechSynthesis.speak(utterance);
        }
    }

    async function queryMistral(prompt) {
        try {
            chatHistory.push({ role: "user", content: prompt });

            const isLongRequest = /chanson|chante|blues|poème|poesie|dis-moi un poeme/i.test(prompt);
            const tokenLimit = isLongRequest ? 90 : 35;

            const response = await mlcEngine.chat.completions.create({
                messages: chatHistory,
                max_tokens: tokenLimit, 
                temperature: 0.1, // Température très basse pour éliminer les incohérences et forcer le respect strict des consignes
            });

            let answer = response.choices[0].message.content;
            
            answer = answer.replace(/^(Fredo|Moi|Tu)\s*:.+?[.!?"']\s*/i, "").trim();

            chatHistory.push({ role: "assistant", content: answer });

            playCaroleSpeech(answer);

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur Mistral : " + err.message;
            if (isConversationActive) {
                setTimeout(() => { try { recognition.start(); } catch(e){} }, 3000);
            }
        }
    }
</script>

</body>
</html>
