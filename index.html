<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Avatar 3D - Carole (Llama Local)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            max-width: 600px;
            height: 420px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .hidden-boxes { display: none; }
        #status { font-weight: bold; margin: 15px 0; color: #ffab00; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/modules/talkinghead.mjs",
            "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
    </script>
</head>
<body>

<div id="avatar-container"></div>

<div class="controls">
    <button id="startBtn" disabled>Chargement de Llama en local...</button>
    <p id="status">Statut : Initialisation du système...</p>

    <div class="hidden-boxes">
        <span id="userText">-</span>
        <span id="geminiText">-</span>
    </div>
</div>

<script type="module">
    import { TalkingHead } from 'talkinghead';
    import { CreateMLCEngine } from '@mlc-ai/web-llm';

    let head;
    let mlcEngine;
    let femaleVoice = null;
    const container = document.getElementById('avatar-container');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');
    const userText = document.getElementById('userText');
    const geminiText = document.getElementById('geminiText');

    // Personnalité de Carole injectée dans le prompt système de Llama
    const systemPrompt = "Tu t'appelles Carole. Tu es née le 21 octobre 1972 à Saïgon au Vietnam. Tu travailles chez Conforama depuis l'an 2000. Tu as une chienne qui s'appelle Cheyenne, c'est un Patou tout blanc né le 4 avril 2018. Réponds toujours en 1 à 2 phrases courtes maximum en français, avec un ton très naturel, chaleureux et conversationnel.";

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        femaleVoice = voices.find(v => v.lang.startsWith('fr') && (
            v.name.includes('Natural') || v.name.includes('Online') || 
            v.name.includes('Denise') || v.name.includes('Eloise') || 
            v.name.includes('Celeste') || v.name.includes('Julie')
        )) || voices.find(v => v.lang.startsWith('fr'));
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    async function initSystem() {
        try {
            // 1. Chargement de l'avatar 3D
            statusText.innerText = "Statut : Chargement de l'avatar 3D...";
            head = new TalkingHead(container, {
                cameraView: "upper",
                lipsyncModules: ["en", "fr"]
            });

            await head.showAvatar({
                url: "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb",
                body: 'F',
                avatarMood: 'neutral',
                lipsyncLang: 'fr'
            });

            // 2. Chargement de Llama 3.2 (3B) en local via WebLLM
            statusText.innerText = "Statut : Téléchargement et chargement de Llama en local (patiente un instant)...";
            
            mlcEngine = await CreateMLCEngine("Llama-3.2-3B-Instruct-q4f16_1-MLC", {
                initProgressCallback: (progress) => {
                    statusText.innerText = `Statut : ${progress.text}`;
                }
            });

            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : Carole et Llama sont prêts !";
            startBtn.disabled = false;
            startBtn.innerText = "🎙️ Démarrer la conversation";

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur d'initialisation : " + err.message;
        }
    }

    initSystem();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isConversationActive = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = true;
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (head && head.audioContext && head.audioContext.state === 'suspended') {
                head.audioContext.resume();
            }
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            if (!isConversationActive) {
                isConversationActive = true;
                startBtn.style.backgroundColor = "#dc3545";
                startBtn.innerText = "🛑 Arrêter la conversation";
                try { recognition.start(); } catch (e) {}
            } else {
                isConversationActive = false;
                startBtn.style.backgroundColor = "#0d6efd";
                startBtn.innerText = "🎙️ Démarrer la conversation";
                recognition.stop();
                statusText.style.color = "#00e676";
                statusText.innerText = "Statut : Conversation arrêtée.";
            }
        });

        recognition.onstart = () => {
            if (isConversationActive) {
                statusText.style.color = "#ffab00";
                statusText.innerText = "Statut : 🎙️ Carole écoute...";
            }
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript;
            userText.innerText = transcript;
            
            recognition.stop();
            statusText.innerText = "Statut : 🧠 Llama réfléchit localement...";
            
            await queryLlama(transcript);
        };
        
        recognition.onerror = (event) => {};

        recognition.onend = () => {
            if (isConversationActive) {
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    async function queryLlama(prompt) {
        try {
            // Appel direct au modèle Llama local en mémoire
            const reply = await mlcEngine.chat.completions.create({
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: prompt }
                ],
            });

            const answer = reply.choices[0].message.content;
            geminiText.innerText = answer;
            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : 🗣️ Carole parle...";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(answer);
                utterance.lang = 'fr-FR';
                utterance.pitch = 1.02;
                utterance.rate = 0.98;
                if (femaleVoice) utterance.voice = femaleVoice;

                head.speakText(answer, {
                    lipsyncLang: 'fr',
                    onEnd: () => {
                        if (isConversationActive) {
                            statusText.style.color = "#ffab00";
                            statusText.innerText = "Statut : 🎙️ Carole écoute...";
                        }
                    }
                });

                window.speechSynthesis.speak(utterance);
            } else {
                head.speakText(answer, {
                    lipsyncLang: 'fr',
                    onEnd: () => { 
                        if (isConversationActive) {
                            statusText.style.color = "#ffab00";
                            statusText.innerText = "Statut : 🎙️ Carole écoute..."; 
                        }
                    }
                });
            }

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur Llama : " + err.message;
            if (isConversationActive) {
                setTimeout(() => { try { recognition.start(); } catch(e){} }, 3000);
            }
        }
    }
</script>

</body>
</html>
