<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Avatar 3D - Carole</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            max-width: 600px;
            height: 420px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .hidden-boxes { display: none; }
        #status { font-weight: bold; margin: 15px 0; color: #ffab00; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/modules/talkinghead.mjs",
            "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm"
        }
    }
    </script>
</head>
<body>

<div id="avatar-container"></div>

<div class="controls">
    <button id="startBtn" disabled>Chargement du système...</button>
    <p id="status">Statut : Initialisation...</p>

    <div class="hidden-boxes">
        <span id="userText">-</span>
        <span id="geminiText">-</span>
    </div>
</div>

<script type="module">
    import { TalkingHead } from 'talkinghead';
    import { CreateMLCEngine } from '@mlc-ai/web-llm';

    let head;
    let mlcEngine;
    let femaleVoice = null;
    const container = document.getElementById('avatar-container');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');
    const userText = document.getElementById('userText');
    const geminiText = document.getElementById('geminiText');

    const systemPrompt = "Tu es Carole, la femme de Fredo. Née le 21 octobre 1972 à Saïgon. Fredo est informaticien à l'AFPA. Vos enfants : Kakou (Audrick) et Bibinou (Alexia). Ta mère : Michelle (Mimi/Mitch). Tu es comptable chez Conforama depuis l'an 2000 avec ta copine Virginie. Votre chienne : Cheyenne (née en 2018). Tu parles à Fredo avec un ton ultra familier, cash, amoureux et complice ('mon chéri', 'tu vois', 'nan mais sérieux'). Pas de langue de bois ni de politesse guindée. Français parfait, direct. Réponds en UNE seule phrase courte.";

    let chatHistory = [
        { role: "system", content: systemPrompt }
    ];

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        femaleVoice = voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Natural') || v.name.includes('Online') || v.name.includes('Google') || v.name.includes('Denise') || v.name.includes('Julie'))) ||
                      voices.find(v => v.lang === 'fr-FR') ||
                      voices.find(v => v.lang.startsWith('fr'));
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    async function initSystem() {
        try {
            statusText.innerText = "Statut : Chargement de l'avatar 3D...";
            head = new TalkingHead(container, {
                cameraView: "upper",
                lipsyncModules: ["en", "fr"],
                ttsEndpoint: ""
            });

            await head.showAvatar({
                url: "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb",
                body: 'F',
                avatarMood: 'neutral',
                lipsyncLang: 'fr'
            });

            statusText.innerText = "Statut : Téléchargement de Mistral-7B en local (patiente, c'est un gros fichier)...";
            
            // UTILISATION DE LA VERSION OPTIMISÉE DE MISTRAL
            mlcEngine = await CreateMLCEngine("Mistral-7B-Instruct-v0.3-q4f16_1-MLC", {
                initProgressCallback: (progress) => {
                    statusText.innerText = `Statut : ${progress.text}`;
                }
            });

            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : Carole (Mistral) est prête !";
            startBtn.disabled = false;
            startBtn.innerText = "🎙️ Démarrer la conversation";

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur d'initialisation : " + err.message;
        }
    }

    initSystem();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isConversationActive = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition(); // SYNTAXE CORRIGÉE STRICTEMENT ICI
        recognition.lang = 'fr-FR';
        recognition.continuous = false;
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (head && head.audioContext && head.audioContext.state === 'suspended') {
                head.audioContext.resume();
            }
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            if (!isConversationActive) {
                isConversationActive = true;
                startBtn.style.backgroundColor = "#dc3545";
                startBtn.innerText = "🛑 Arrêter la conversation";
                try { recognition.start(); } catch (e) {}
            } else {
                isConversationActive = false;
                startBtn.style.backgroundColor = "#0d6efd";
                startBtn.innerText = "🎙️ Démarrer la conversation";
                try { recognition.stop(); } catch (e) {}
                window.speechSynthesis.cancel();
                statusText.style.color = "#00e676";
                statusText.innerText = "Statut : Conversation arrêtée.";
            }
        });

        recognition.onstart = () => {
            if (isConversationActive) {
                statusText.style.color = "#ffab00";
                statusText.innerText = "Statut : 🎙️ Carole écoute... Parle !";
            }
        };

        // GESTION PROpre DE LA COUPURE DU MICRO QUAND L'UTILISATEUR PARLE
        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = transcript;
            
            // On stoppe net le micro pour qu'il arrête d'écouter pendant que l'IA traite et répond
            try { recognition.stop(); } catch (e) {}

            statusText.innerText = "Statut : 🧠 Mistral réfléchit...";
            await queryMistral(transcript);
        };
        
        recognition.onerror = (event) => {
            if (isConversationActive && (event.error === 'no-match' || event.error === 'aborted')) {
                setTimeout(() => {
                    if (isConversationActive) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 500);
            }
        };

        recognition.onend = () => {
            // Si la conversation est active mais que le micro s'est coupé tout seul sans qu'on parle, on le relance
            if (isConversationActive && statusText.innerText.includes("écoute")) {
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    function formatFrenchPronunciation(text) {
        return text
            .replace(/\bafpa\b/gi, "A. F. P. A.")
            .replace(/\b1972\b/g, "mille neuf cent soixante-douze")
            .replace(/\b2000\b/g, "deux mille")
            .replace(/\b2018\b/g, "deux mille dix-huit");
    }

    async function queryMistral(prompt) {
        try {
            chatHistory.push({ role: "user", content: prompt });

            const reply = await mlcEngine.chat.completions.create({
                messages: chatHistory,
                max_tokens: 45, 
                temperature: 0.7,
            });

            let answer = reply.choices[0].message.content;
            chatHistory.push({ role: "assistant", content: answer });

            let spokenAnswer = formatFrenchPronunciation(answer);

            geminiText.innerText = answer;
            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : 🗣️ Carole parle...";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(spokenAnswer);
                utterance.lang = 'fr-FR';
                utterance.pitch = 0.98;
                utterance.rate = 1.15;
                
                if (femaleVoice) utterance.voice = femaleVoice;

                // Quand Carole a fini de parler, on relance le micro proprement
                utterance.onend = () => {
                    if (isConversationActive) {
                        statusText.style.color = "#ffab00";
                        statusText.innerText = "Statut : 🎙️ Carole écoute...";
                        setTimeout(() => {
                            try { recognition.start(); } catch (e) {}
                        }, 400);
                    }
                };

                head.speakText(spokenAnswer, { 
                    lipsyncLang: 'fr',
                    audioVolume: 0 
                });
                
                window.speechSynthesis.speak(utterance);
            }

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur Mistral : " + err.message;
            if (isConversationActive) {
                setTimeout(() => { try { recognition.start(); } catch(e){} }, 3000);
            }
        }
    }
</script>

</body>
</html>
