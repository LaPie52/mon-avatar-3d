<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carole & Gemini - Mode Hybride</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin: 5px;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .chat-input-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: white;
            font-size: 15px;
        }
        #status { font-weight: bold; margin: 10px 0; color: #ffab00; font-size: 14px; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/modules/talkinghead.mjs"
        }
    }
    </script>
</head>
<body>

<div id="avatar-container"></div>

<div class="controls">
    <button id="startBtn" disabled>Chargement...</button>
    <p id="status">Statut : Initialisation...</p>

    <div class="chat-input-row">
        <input type="text" id="textInput" placeholder="Ou écris ton message ici à Carole..." autocomplete="off">
        <button id="sendBtn">Envoyer</button>
    </div>
</div>

<script type="module">
    import { TalkingHead } from 'talkinghead';

    let head;
    let femaleVoice = null;
    const container = document.getElementById('avatar-container');
    const startBtn = document.getElementById('startBtn');
    const sendBtn = document.getElementById('sendBtn');
    const textInput = document.getElementById('textInput');
    const statusText = document.getElementById('status');

    let GEMINI_API_KEY = localStorage.getItem('carole_gemini_key');

    if (!GEMINI_API_KEY) {
        GEMINI_API_KEY = prompt("Entre ta clé API Google Gemini pour activer Carole :");
        if (GEMINI_API_KEY) {
            localStorage.setItem('carole_gemini_key', GEMINI_API_KEY.trim());
        }
    }

    const systemInstruction = `Tu es Carole, née le 21 octobre 1972 à Saïgon. Comptable chez Conforama, tu habites à Voulangis avec ton mari Fredo. 
    RÈGLES ABSOLUES :
    - Fais des réponses TRÈS COURTES (1 ou 2 phrases maximum, pas plus de 25 mots). 
    - Parle de façon orale, directe, taquine et spontanée, comme par SMS ou de vive voix dans un salon.`;

    let chatHistory = [];
    let isConversationActive = false;

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            femaleVoice = voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('FR France'))) ||
                          voices.find(v => v.lang === 'fr-FR' && v.name.includes('Female')) ||
                          voices.find(v => v.lang.startsWith('fr'));
        }
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    async function initSystem() {
        try {
            if (!GEMINI_API_KEY) {
                statusText.innerText = "Erreur : Clé API manquante.";
                return;
            }

            statusText.innerText = "Statut : Chargement de l'avatar 3D...";
            
            head = new TalkingHead(container, {
                cameraView: "upper",
                lipsyncModules: [] 
            });

            await head.showAvatar({
                url: "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb",
                body: 'F',
                avatarMood: 'neutral',
                lipsyncLang: 'fr'
            });

            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : Carole est prête !";
            startBtn.disabled = false;
            startBtn.innerText = "🎙️ Activer la voix";

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur : " + err.message;
            console.error(err);
        }
    }

    initSystem();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = false;
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            if (!isConversationActive) {
                isConversationActive = true;
                startBtn.style.backgroundColor = "#dc3545";
                startBtn.innerText = "🛑 Couper le micro";
                playCaroleSpeech("Salut, ça va ?");
            } else {
                isConversationActive = false;
                startBtn.style.backgroundColor = "#0d6efd";
                startBtn.innerText = "🎙️ Activer la voix";
                try { recognition.stop(); } catch (e) {}
                window.speechSynthesis.cancel();
                statusText.style.color = "#00e676";
                statusText.innerText = "Statut : Prête.";
            }
        });

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            try { recognition.stop(); } catch (e) {}
            statusText.innerText = "Statut : 🧠 Gemini réfléchit...";
            await queryGemini(transcript);
        };
        
        recognition.onerror = () => {
            if (isConversationActive) {
                setTimeout(() => { try { recognition.start(); } catch (e) {} }, 1000);
            }
        };

        recognition.onend = () => {
            if (isConversationActive && statusText.innerText.includes("écoute")) {
                try { recognition.start(); } catch (e) {}
            }
        };
    } else {
        startBtn.style.display = "none";
    }

    sendBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (text) {
            textInput.value = "";
            statusText.innerText = "Statut : 🧠 Gemini réfléchit...";
            queryGemini(text);
        }
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendBtn.click();
        }
    });

    function formatText(text) {
        return text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{2764}\u2661]/gu, '').replace(/[*_#"`]/g, '');
    }

    function playCaroleSpeech(textToSpeak) {
        let clean = formatText(textToSpeak);
        statusText.style.color = "#00e676";
        statusText.innerText = "Statut : 🗣️ Carole parle...";

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(clean);
            utterance.lang = 'fr-FR';
            utterance.pitch = 1.0;
            utterance.rate = 1.05;
            if (femaleVoice) utterance.voice = femaleVoice;

            utterance.onend = () => {
                if (isConversationActive && recognition) {
                    statusText.style.color = "#ffab00";
                    statusText.innerText = "Statut : 🎙️ Carole écoute...";
                    try { recognition.start(); } catch (e) {}
                } else {
                    statusText.style.color = "#00e676";
                    statusText.innerText = "Statut : Carole a répondu.";
                }
            };

            window.speechSynthesis.speak(utterance);
        }
    }

    async function queryGemini(prompt) {
        chatHistory.push({ role: "user", parts: [{ text: prompt }] });

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: chatHistory,
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 60 
                    }
                })
            });

            if (!response.ok) throw new Error(`HTTP error ${response.status}`);

            const data = await response.json();
            if (!data.candidates || data.candidates.length === 0) throw new Error("Réponse vide");

            const answer = data.candidates[0].content.parts[0].text.trim();
            chatHistory.push({ role: "model", parts: [{ text: answer }] });

            playCaroleSpeech(answer);

        } catch (err) {
            console.error("Erreur Gemini :", err);
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur de communication API.";
            chatHistory.pop();
        }
    }
</script>

</body>
</html>
