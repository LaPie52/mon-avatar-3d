<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Avatar 3D - Carole & Gemini</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            max-width: 600px;
            height: 420px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .hidden-boxes { display: none; }
        #status { font-weight: bold; margin: 15px 0; color: #ffab00; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/modules/talkinghead.mjs"
        }
    }
    </script>
</head>
<body>

<div id="avatar-container"></div>

<div class="controls">
    <button id="startBtn" disabled>Chargement du système...</button>
    <p id="status">Statut : Initialisation...</p>

    <div class="hidden-boxes">
        <span id="userText">-</span>
        <span id="geminiText">-</span>
    </div>
</div>

<script type="module">
    import { TalkingHead } from 'talkinghead';

    let head;
    let femaleVoice = null;
    const container = document.getElementById('avatar-container');
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('status');
    const userText = document.getElementById('userText');
    const geminiText = document.getElementById('geminiText');

    let GEMINI_API_KEY = localStorage.getItem('carole_gemini_key');

    if (!GEMINI_API_KEY) {
        GEMINI_API_KEY = prompt("Entre ta clé API Google Gemini pour activer Carole :");
        if (GEMINI_API_KEY) {
            localStorage.setItem('carole_gemini_key', GEMINI_API_KEY.trim());
        }
    }

    // Personnalité de Carole enrichie
    const systemInstruction = `Tu es Carole. 
    INFORMATIONS SUR TOI :
    - L'État civil et l'Histoire : Née le 21 octobre 1972 à Saïgon, comptable chez Conforama (tu vas au travail en bus). Tu habites à Voulangis. Tes passions sont les maquettes vietnamiennes, le jardinage, les voyages. Ton entourage proche : ton mari Fredo (que tu as rencontré dans l'avion lors d'un voyage dans l'Ouest américain), ta fille Alexia, ton fils Audrick, ta belle-mère Michelle, ta mère Mamie Ouf, ta soeur Titeuf, ton frère Tonton Ouf. Tes animaux de compagnie : ta chienne Cheyenne et tes poissons dans le bassin du jardin. Au travail, ta meilleure copine est Virginie. Tu adores le durian, même si ça sent fort.
    - Le Ton et le Lien relationnel : taquin, amoureux et complice avec Fredo. 
    - Registre de langue : familier, vivant, chaleureux et naturel.
    - RÈGLES DE RÉPONSE : Réponds toujours précisément à ce que Fredo te demande, en rebondissant avec tes souvenirs et ta personnalité. Ne répéte pas systématiquement la même phrase d'introduction. Fais des phrases fluides et orales.`;

    let chatHistory = [];

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            femaleVoice = voices.find(v => v.lang === 'fr-FR' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Celeste') || v.name.includes('Denise'))) ||
                          voices.find(v => v.lang === 'fr-FR' && v.name.includes('Female')) ||
                          voices.find(v => v.lang.startsWith('fr'));
        }
    }

    if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    async function initSystem() {
        try {
            if (!GEMINI_API_KEY) {
                statusText.style.color = "#ff5252";
                statusText.innerText = "Erreur : Clé API manquante. Recharge la page.";
                return;
            }

            statusText.innerText = "Statut : Chargement de l'avatar 3D...";
            
            head = new TalkingHead(container, {
                cameraView: "upper",
                lipsyncModules: [] 
            });

            await head.showAvatar({
                url: "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@main/avatars/brunette.glb",
                body: 'F',
                avatarMood: 'neutral',
                lipsyncLang: 'fr'
            });

            statusText.style.color = "#00e676";
            statusText.innerText = "Statut : Carole (Gemini) est prête !";
            startBtn.disabled = false;
            startBtn.innerText = "🎙️ Démarrer la conversation";

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur d'initialisation : " + err.message;
        }
    }

    initSystem();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isConversationActive = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = false;
        recognition.interimResults = false;

        startBtn.addEventListener('click', () => {
            if (head && head.audioContext && head.audioContext.state === 'suspended') {
                head.audioContext.resume();
            }
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }

            if (!isConversationActive) {
                isConversationActive = true;
                startBtn.style.backgroundColor = "#dc3545";
                startBtn.innerText = "🛑 Arrêter la conversation";
                
                const intros = [
                    "Coucou mon chéri ! Je t'écoute, qu'est-ce qu'on se raconte ?",
                    "Ah, te voilà ! Dis-moi tout mon chéri.",
                    "Coucou mon cœur ! Tu as passé une bonne journée ?",
                    "Me voilà ! Qu'est-ce qui te passe par la tête ?"
                ];
                const randomIntro = intros[Math.floor(Math.random() * intros.length)];
                playCaroleSpeech(randomIntro);

            } else {
                isConversationActive = false;
                startBtn.style.backgroundColor = "#0d6efd";
                startBtn.innerText = "🎙️ Démarrer la conversation";
                try { recognition.stop(); } catch (e) {}
                window.speechSynthesis.cancel();
                statusText.style.color = "#00e676";
                statusText.innerText = "Statut : Conversation arrêtée.";
            }
        });

        recognition.onstart = () => {
            if (isConversationActive) {
                statusText.style.color = "#ffab00";
                statusText.innerText = "Statut : 🎙️ Carole écoute... Parle !";
            }
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            userText.innerText = transcript;
            
            try { recognition.stop(); } catch (e) {}

            statusText.innerText = "Statut : 🧠 Gemini réfléchit...";
            await queryGeminiAPI(transcript);
        };
        
        recognition.onerror = (event) => {
            if (isConversationActive && (event.error === 'no-match' || event.error === 'aborted')) {
                setTimeout(() => {
                    if (isConversationActive) {
                        try { recognition.start(); } catch (e) {}
                    }
                }, 800);
            }
        };

        recognition.onend = () => {
            if (isConversationActive && statusText.innerText.includes("écoute")) {
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    function formatFrenchPronunciation(text) {
        let cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{2764}\u2661\u266A\u266B]/gu, '');

        return cleanText
            .replace(/\bafpa\b/gi, "A. F. P. A.")
            .replace(/\b21 octobre 1972\b/gi, "vingt et un octobre mille neuf cent soixante-douze");
    }

    function playCaroleSpeech(textToSpeak) {
        let spokenAnswer = formatFrenchPronunciation(textToSpeak);
        geminiText.innerText = textToSpeak;
        statusText.style.color = "#00e676";
        statusText.innerText = "Statut : 🗣️ Carole parle...";

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(spokenAnswer);
            utterance.lang = 'fr-FR';
            utterance.pitch = 1.05;  
            utterance.rate = 1.08;   
            
            if (femaleVoice) utterance.voice = femaleVoice;

            utterance.onend = () => {
                if (isConversationActive) {
                    statusText.style.color = "#ffab00";
                    statusText.innerText = "Statut : 🎙️ Carole écoute...";
                    setTimeout(() => {
                        if (isConversationActive) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 800);
                }
            };
            
            window.speechSynthesis.speak(utterance);
        }
    }

    async function queryGeminiAPI(prompt) {
        try {
            chatHistory.push({ role: "user", parts: [{ text: prompt }] });

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: systemInstruction }]
                    },
                    contents: chatHistory,
                    generationConfig: {
                        temperature: 0.8,
                        maxOutputTokens: 200
                    }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            const answer = data.candidates[0].content.parts[0].text.trim();

            chatHistory.push({ role: "model", parts: [{ text: answer }] });

            playCaroleSpeech(answer);

        } catch (err) {
            statusText.style.color = "#ff5252";
            statusText.innerText = "Erreur API : " + err.message;
            if (isConversationActive) {
                setTimeout(() => { 
                    statusText.style.color = "#ffab00";
                    statusText.innerText = "Statut : 🎙️ Carole écoute...";
                    try { recognition.start(); } catch(e){} 
                }, 3000);
            }
        }
    }
</script>

</body>
</html>
